[project]
name = "playbook-00-multimodal-feature-store-gtzan"
version = "1.1.0"
description = "A multimodal feature store for music audio and spectrograms: FastAPI, PostgreSQL, Milvus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.5.2",
    "asyncpg>=0.30.0",
    "pymilvus>=2.5.0,<3.1",  # 3.1 removes the ORM API that src/db/milvus.py uses
    "numpy>=1.26.0",
    "librosa>=0.10.1",
    "soundfile>=0.13",
    "torch>=2.3.0",
    "torchvision>=0.16.0",
    "sentence-transformers>=4.0.0",
    "pillow>=10.2.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "kaggle>=1.7",    # download_data.py (make data)
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

# PyTorch from the CPU-only index on Linux (CI and Codespaces), so no CUDA wheels are downloaded.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
