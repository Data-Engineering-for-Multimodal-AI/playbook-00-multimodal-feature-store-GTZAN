[project]
name = "playbook-00-multimodal-feature-store-gtzan"
version = "2026.10"
description = "A multimodal feature store for music (GTZAN audio and spectrograms): FastAPI, PostgreSQL, Milvus"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.5",
    "asyncpg>=0.30",
    "pymilvus>=3.0",               # the MilvusClient API (the ORM API is deprecated)
    "numpy>=2.0",
    "librosa>=0.11",
    "soundfile>=0.13",
    "torch>=2.6",
    "torchvision>=0.21",
    "pillow>=11",
    "sentence-transformers>=4.0",  # lyrics (no lyrics in GTZAN; for your own data)
    "requests>=2.32",
    "kaggle>=1.7",                 # download_data.py
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
