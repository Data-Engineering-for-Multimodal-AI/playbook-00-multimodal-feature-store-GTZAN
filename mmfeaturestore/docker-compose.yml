# PostgreSQL (song metadata and jobs) and Milvus standalone (vectors), on 127.0.0.1.
#   docker compose up -d --wait
# The repository root's docker-compose.yml includes this file, so `docker compose up -d` works from
# either folder and starts the same containers. Data lives in named Docker volumes;
# `docker compose down -v` deletes it. PostgreSQL listens on host port 5433, so a local PostgreSQL
# on 5432 can keep running. The credentials are local development defaults.
# Adapted from the update-2026 branch (PostgreSQL 17, Milvus 3.0.3 with health checks).
name: playbook-00-gtzan

x-milvus-image: &milvus-image milvusdb/milvus:v3.0.3

services:
  postgres:
    image: postgres:17
    container_name: gtzan-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-featurestore_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-featurestore}
      POSTGRES_DB: ${POSTGRES_DB:-featurestore}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Gives the Milvus user ownership of its (new, empty) volume, then exits.
  milvus-volume-init:
    image: *milvus-image
    user: "0:0"
    network_mode: none
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        chown -R "$$(id -u milvus):$$(id -g milvus)" /var/lib/milvus
    volumes:
      - milvus_data:/var/lib/milvus

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 20s
      retries: 6

  minio:
    container_name: milvus-minio
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 20s
      retries: 6

  standalone:
    container_name: milvus-standalone
    image: *milvus-image
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      milvus-volume-init:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      start_period: 90s
      timeout: 20s
      retries: 12

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
